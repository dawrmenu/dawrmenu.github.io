<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizo Dawr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF5EC;
    --paper:#F3ECDF;
    --ink:#2B241C;
    --brick:#A6402A;
    --brick-dark:#813020;
    --mustard:#C9922B;
    --line: rgba(43,36,28,0.14);
    --wa:#3FA35B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    padding-bottom:96px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  /* Header */
  header{
    background:var(--ink);
    color:var(--cream);
    padding:34px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:var(--brick);
    opacity:0.35;
    filter:blur(2px);
  }
  .eyebrow{
    font-family:'Karla',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11.5px;
    color:var(--mustard);
    font-weight:700;
    margin:0 0 6px;
  }
  header h1{
    font-size:38px;
    margin:0 0 6px;
    color:var(--cream);
    position:relative;
  }
  header p.sub{
    margin:0;
    font-size:14.5px;
    color:rgba(250,245,236,0.72);
    max-width:34ch;
    line-height:1.5;
    position:relative;
  }

  /* Category nav */
  .catnav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 16px;
    background:var(--cream);
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .catnav::-webkit-scrollbar{display:none;}
  .catchip{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:100px;
    background:var(--paper);
    border:1px solid var(--line);
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
    white-space:nowrap;
  }
  .catchip.active{
    background:var(--brick);
    border-color:var(--brick);
    color:var(--cream);
  }

  main{padding:6px 16px 20px;}

  .category-block{padding-top:26px; scroll-margin-top:64px;}
  .category-title{
    font-size:22px;
    margin:0 0 3px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .category-title .count{
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--brick);
  }
  .category-rule{
    height:2px;
    width:38px;
    background:var(--mustard);
    margin:0 0 16px;
    border-radius:2px;
  }

  .item-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:6px;
  }
  .item-card{
    display:flex;
    flex-direction:column;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .item-img{
    width:100%;
    height:104px;
    object-fit:cover;
    display:block;
    background:#ddd3bd;
  }
  .item-info{flex:1; min-width:0; padding:10px 11px 11px;}
  .item-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 2px;
    line-height:1.25;
  }
  .item-desc{
    margin:0 0 6px;
    font-size:11.5px;
    color:rgba(43,36,28,0.62);
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .item-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-top:4px;
  }
  .item-price{
    font-weight:700;
    font-size:15px;
    color:var(--brick-dark);
  }
  .item-price::before{content:"₹";font-weight:700;}

  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    border:1.5px solid var(--brick);
    border-radius:100px;
    overflow:hidden;
    height:28px;
    flex:0 0 auto;
  }
  .stepper button{
    width:26px; height:28px;
    border:none;
    background:transparent;
    color:var(--brick);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stepper button:active{background:rgba(166,64,42,0.12);}
  .stepper .qty{
    min-width:16px;
    text-align:center;
    font-weight:700;
    font-size:12.5px;
  }
  .add-btn{
    border:none;
    background:var(--brick);
    color:var(--cream);
    font-weight:700;
    font-size:12px;
    padding:0 13px;
    height:28px;
    border-radius:100px;
    cursor:pointer;
    letter-spacing:0.02em;
    flex:0 0 auto;
  }
  .add-btn:active{background:var(--brick-dark);}

  /* Floating cart bar */
  .cartbar{
    position:fixed;
    left:16px; right:16px; bottom:16px;
    background:var(--ink);
    color:var(--cream);
    border-radius:16px;
    padding:13px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 30px rgba(0,0,0,0.28);
    z-index:30;
    cursor:pointer;
  }
  .cartbar.show{display:flex;}
  .cartbar .left{display:flex; align-items:center; gap:10px;}
  .cartbar .badge{
    background:var(--mustard);
    color:var(--ink);
    font-weight:700;
    font-size:12.5px;
    min-width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .cartbar .label{font-weight:700; font-size:14.5px;}
  .cartbar .total{font-weight:700; font-size:15px; color:var(--mustard);}

  /* Cart modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,16,10,0.5);
    z-index:40;
    display:none;
  }
  .overlay.show{display:block;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:82vh;
    background:var(--cream);
    border-radius:20px 20px 0 0;
    z-index:41;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform 0.28s ease;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-head{
    padding:16px 18px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .sheet-head h2{font-size:19px; margin:0;}
  .sheet-close{
    background:var(--paper);
    border:none;
    width:30px;height:30px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
  }
  .sheet-body{
    overflow-y:auto;
    padding:8px 18px 12px;
    flex:1;
  }
  .cart-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .cart-row .cname{font-weight:700; font-size:14.5px;}
  .cart-row .cline{font-size:12px; color:rgba(43,36,28,0.55);}
  .empty-msg{
    text-align:center;
    padding:40px 10px;
    color:rgba(43,36,28,0.55);
    font-size:14px;
  }
  .sheet-foot{
    padding:14px 18px 20px;
    border-top:1px solid var(--line);
    background:var(--cream);
  }
  .totalrow{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    font-size:16px;
    margin-bottom:12px;
  }
  .form-row{margin-bottom:10px;}
  .form-row label{
    display:block;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:rgba(43,36,28,0.6);
    margin-bottom:4px;
  }
  .form-row input, .form-row textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 11px;
    font-family:'Karla',sans-serif;
    font-size:14px;
    background:var(--paper);
    color:var(--ink);
  }
  .wa-btn{
    width:100%;
    background:var(--wa);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-weight:700;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    cursor:pointer;
  }
  .wa-btn:active{opacity:0.9;}
  .wa-btn svg{width:19px; height:19px; fill:#fff;}
</style>
</head>
<body>

<header>
  <p class="eyebrow">Homestyle Mizo Kitchen</p>
  <h1>Mizo Dawr</h1>
  <p class="sub">Rice meals, chow, and pork specials made the way home tastes. Add what you want, order straight to WhatsApp.</p>
</header>

<nav class="catnav" id="catnav"></nav>

<main id="menu"></main>

<div class="cartbar" id="cartbar" onclick="openCart()">
  <div class="left">
    <span class="badge" id="cartCount">0</span>
    <span class="label">View cart</span>
  </div>
  <span class="total" id="cartTotal">₹0</span>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2>Your order</h2>
    <button class="sheet-close" onclick="closeCart()">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>

<script>
const WHATSAPP_NUMBER = "917021795641";

const MENU = [
  {cat:"Rice Meals", items:[
    {name:"Rice Meal (Medium)", price:150, desc:"Rice + Beef/Pork + Bai + Pickle", img:"https://loremflickr.com/400/400/rice"},
    {name:"Rice Meal (Full)", price:200, desc:"Rice + Beef/Pork + Bai + Pickle + Tlak + Dal", img:"https://loremflickr.com/400/400/curry"},
  ]},
  {cat:"Noodles & Porridge", items:[
    {name:"Sanpiau", price:60, desc:"Rice Porridge", img:"https://loremflickr.com/400/400/porridge"},
    {name:"Chow Tui Nei", price:60, desc:"Noodle Soup", img:"https://loremflickr.com/400/400/noodlesoup"},
    {name:"Chow Fry", price:70, desc:"Fried Noodle", img:"https://loremflickr.com/400/400/noodles"},
    {name:"Chicken Fried Waiwai", price:60, desc:"", img:"https://loremflickr.com/400/400/chicken"},
  ]},
  {cat:"Pork & Meat Specials", items:[
    {name:"Sachek", price:50, desc:"Beef Intestine", img:"https://loremflickr.com/400/400/meat"},
    {name:"Vawk Lu Bawl", price:100, desc:"Mixed Pork Head", img:"https://loremflickr.com/400/400/pork"},
    {name:"Vawk Ke Bawl", price:100, desc:"Mixed Pork Leg", img:"https://loremflickr.com/400/400/porkbelly"},
    {name:"Sawhchiar", price:60, desc:"", img:"https://loremflickr.com/400/400/stew"},
  ]},
  {cat:"Soups", items:[
    {name:"Vaimim Chhum", price:70, desc:"Corn Soup", img:"https://loremflickr.com/400/400/cornsoup"},
  ]},
  {cat:"Extras & Sides", items:[
    {name:"Thingpui", price:10, desc:"Tea", img:"https://loremflickr.com/400/400/tea"},
    {name:"Chhangban", price:20, desc:"Sticky Rice", img:"https://loremflickr.com/400/400/stickyrice"},
    {name:"Artui Chhum", price:10, desc:"Boiled Egg", img:"https://loremflickr.com/400/400/egg"},
    {name:"Artui Kan", price:10, desc:"Fried Egg", img:"https://loremflickr.com/400/400/friedegg"},
  ]},
];

let cart = {}; // key: item name -> {name, price, qty}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function renderMenu(){
  const nav = document.getElementById('catnav');
  const menu = document.getElementById('menu');
  nav.innerHTML = '';
  menu.innerHTML = '';

  MENU.forEach((group, gi) => {
    const chip = document.createElement('a');
    chip.href = '#cat-' + slug(group.cat);
    chip.className = 'catchip' + (gi===0 ? ' active':'');
    chip.textContent = group.cat;
    chip.dataset.cat = slug(group.cat);
    nav.appendChild(chip);

    const block = document.createElement('div');
    block.className = 'category-block';
    block.id = 'cat-' + slug(group.cat);
    block.innerHTML = `
      <h2 class="category-title">${group.cat} <span class="count">${group.items.length} items</span></h2>
      <div class="category-rule"></div>
      <div class="item-grid"></div>
    `;
    const grid = block.querySelector('.item-grid');
    group.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <img class="item-img" src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="item-info">
          <p class="item-name">${item.name}</p>
          ${item.desc ? `<p class="item-desc">${item.desc}</p>` : ''}
          <div class="item-bottom">
            <span class="item-price">${item.price}</span>
            <div id="ctrl-${slug(item.name)}"></div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    menu.appendChild(block);
    group.items.forEach(item => renderControl(item));
  });

  // scrollspy-lite: highlight nav on click
  nav.querySelectorAll('.catchip').forEach(c => {
    c.addEventListener('click', () => {
      nav.querySelectorAll('.catchip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
    });
  });
}

function renderControl(item){
  const el = document.getElementById('ctrl-' + slug(item.name));
  const inCart = cart[item.name];
  if (!inCart) {
    el.innerHTML = `<button class="add-btn" onclick="addItem('${item.name.replace(/'/g,"\\'")}', ${item.price})">Add</button>`;
  } else {
    el.innerHTML = `
      <div class="stepper">
        <button onclick="changeQty('${item.name.replace(/'/g,"\\'")}', -1)">−</button>
        <span class="qty">${inCart.qty}</span>
        <button onclick="changeQty('${item.name.replace(/'/g,"\\'")}', 1)">+</button>
      </div>
    `;
  }
}

function addItem(name, price){
  cart[name] = { name, price, qty: 1 };
  renderControl({name, price});
  updateCartBar();
}
function changeQty(name, delta){
  if (!cart[name]) return;
  cart[name].qty += delta;
  if (cart[name].qty <= 0) {
    delete cart[name];
  }
  const item = MENU.flatMap(g=>g.items).find(i=>i.name===name);
  renderControl(item);
  updateCartBar();
  renderCartSheet();
}

function cartArray(){ return Object.values(cart); }
function cartTotal(){ return cartArray().reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount(){ return cartArray().reduce((s,i)=>s+i.qty,0); }

function updateCartBar(){
  const bar = document.getElementById('cartbar');
  const count = cartCount();
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = '₹' + cartTotal();
  bar.classList.toggle('show', count > 0);
}

function renderCartSheet(){
  const body = document.getElementById('sheetBody');
  const foot = document.getElementById('sheetFoot');
  const items = cartArray();

  if (items.length === 0) {
    body.innerHTML = `<div class="empty-msg">Your cart is empty.<br>Add something tasty from the menu.</div>`;
    foot.innerHTML = '';
    return;
  }

  body.innerHTML = items.map(i => `
    <div class="cart-row">
      <div>
        <div class="cname">${i.name}</div>
        <div class="cline">₹${i.price} × ${i.qty}</div>
      </div>
      <div class="stepper">
        <button onclick="changeQty('${i.name.replace(/'/g,"\\'")}', -1)">−</button>
        <span class="qty">${i.qty}</span>
        <button onclick="changeQty('${i.name.replace(/'/g,"\\'")}', 1)">+</button>
      </div>
    </div>
  `).join('');

  foot.innerHTML = `
    <div class="totalrow"><span>Total</span><span>₹${cartTotal()}</span></div>
    <div class="form-row">
      <label>Your name</label>
      <input id="custName" type="text" placeholder="e.g. Lalrinawmi">
    </div>
    <div class="form-row">
      <label>Delivery address / notes</label>
      <textarea id="custNote" rows="2" placeholder="Room no, PG name, landmark..."></textarea>
    </div>
    <button class="wa-btn" onclick="sendToWhatsApp()">
      <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.29-.15-1.7-.84-1.97-.93-.26-.1-.46-.15-.65.14-.2.3-.75.94-.92 1.13-.17.2-.34.22-.63.08-.29-.15-1.22-.45-2.32-1.44-.86-.76-1.44-1.71-1.6-2-.17-.3-.02-.46.13-.6.13-.13.29-.34.44-.51.15-.17.2-.3.29-.49.1-.2.05-.37-.02-.51-.08-.15-.65-1.58-.9-2.16-.24-.58-.48-.5-.65-.5-.17 0-.37-.02-.56-.02-.2 0-.51.07-.78.37-.27.3-1.02 1-1.02 2.44 0 1.44 1.05 2.83 1.2 3.02.15.2 2.06 3.15 5 4.42.7.3 1.24.48 1.67.62.7.22 1.34.19 1.84.12.56-.08 1.7-.7 1.95-1.37.24-.68.24-1.26.17-1.38-.07-.12-.26-.2-.55-.34z"/><path d="M12.01 2C6.5 2 2.02 6.48 2.02 12c0 1.85.5 3.58 1.36 5.07L2 22l5.08-1.33A9.96 9.96 0 0 0 12.01 22C17.52 22 22 17.52 22 12S17.52 2 12.01 2zm0 18.2a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.02.79.8-2.94-.2-.3A8.19 8.19 0 1 1 20.2 12a8.2 8.2 0 0 1-8.19 8.2z"/></svg>
      Order on WhatsApp
    </button>
  `;
}

function openCart(){
  renderCartSheet();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeCart(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

function sendToWhatsApp(){
  const items = cartArray();
  if (items.length === 0) return;
  const name = (document.getElementById('custName').value || '').trim();
  const note = (document.getElementById('custNote').value || '').trim();

  let msg = "Hi Mizo Dawr! I'd like to order:\n\n";
  items.forEach(i => {
    msg += `• ${i.name} x${i.qty} — ₹${i.price * i.qty}\n`;
  });
  msg += `\nTotal: ₹${cartTotal()}`;
  if (name) msg += `\n\nName: ${name}`;
  if (note) msg += `\nAddress/Notes: ${note}`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.location.href = url;
}

renderMenu();
</script>

</body>
</html>
